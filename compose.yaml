name: openfacto
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-openfacto}
    command: [postgres, -c, timezone=UTC]
    ports: ["127.0.0.1:${OPENFACTO_POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.4.0-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:${OPENFACTO_RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${OPENFACTO_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 5s
      timeout: 5s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.15.5
    environment:
      QDRANT__TELEMETRY_DISABLED: 'true'
    ports: ["127.0.0.1:${OPENFACTO_QDRANT_PORT:-6333}:6333"]
    volumes: [qdrant-data:/qdrant/storage]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /readyz HTTP/1.0\r\n\r\n" >&3;
          read -r line <&3; [[ "$$line" == *" 200 "* ]]'
      interval: 5s
      timeout: 3s
      retries: 20
  s3:
    image: chrislusf/seaweedfs:4.38
    command:
      - mini
      - -dir=/data
      - -ip=s3
      - -s3.port=9000
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-openfacto-private}
    ports: ["127.0.0.1:${OPENFACTO_S3_PORT:-9000}:9000"]
    volumes: [s3-data:/data]
    healthcheck:
      test:
        - CMD-SHELL
        - 'test "$$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9000/)" = "403"'
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  rabbitmq-data:
  qdrant-data:
  s3-data:
