[project]
name = "openfacto-pdf-worker"
version = "0.1.0"
description = "Isolated, bounded text extraction for private PDF uploads"
requires-python = ">=3.12"
dependencies = ["pymupdf==1.28.2"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
