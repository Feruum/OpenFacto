[project]
name = "openfacto-semantic-worker"
version = "0.1.0"
description = "Loopback multilingual embeddings and reranking"
requires-python = ">=3.12,<3.13"
dependencies = ["sentence-transformers>=5,<6", "torch>=2.6,<3"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
